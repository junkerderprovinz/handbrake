name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          # DL3008: apt versions stay unpinned, the package set moves with the
          #         Ubuntu series of the Selkies base.
          # DL3009: the apt lists are cleaned once, at the end of each install RUN.
          ignore: DL3008,DL3009
          failure-threshold: warning

  shellcheck:
    name: ShellCheck (shipped scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # No --shell override: the shebangs decide, and the with-contenv
          # scripts carry a "shellcheck shell=bash" directive.
          SCRIPTS=$(find rootfs -type f \( -name '*.sh' -o -name 'run' -o -name 'autostart' \))

          if [ -z "${SCRIPTS}" ]; then
            echo "ERROR: no shell scripts found, the find pattern is broken." >&2
            exit 1
          fi

          echo "Checking the following scripts:"
          echo "${SCRIPTS}"
          echo "---"

          # SC1091: the sourced files only exist inside the image.
          # shellcheck disable=SC2086
          shellcheck -S warning -x -e SC1091 ${SCRIPTS}

          echo "All scripts passed shellcheck."

      # Every script above is 644 in git and gets its executable bit from the
      # single chmod in the Dockerfile, so the two lists have to match.
      - name: Every shipped script is in the Dockerfile's chmod list
        run: |
          set -euo pipefail

          sed -n '/^RUN chmod +x/,/^$/p' Dockerfile \
            | tr -d '\\' | tr -d ' \t' | grep '^/' | sort -u > /tmp/chmod-list

          find rootfs -type f \( -name '*.sh' -o -name 'run' -o -name 'autostart' \) \
            | sed 's|^rootfs||' | sort -u > /tmp/shipped

          # Two-way: a shipped script missing from the list boots to exit 126,
          # and a stale list entry breaks the build with "No such file".
          if ! diff -u /tmp/chmod-list /tmp/shipped; then
            echo "::error file=Dockerfile::the chmod +x list and the shipped scripts have drifted apart (- list, + on disk)"
            exit 1
          fi
          echo "Every shipped script is chmod +x'd by the Dockerfile."

  xml-validate:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate XML files
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          found=0
          for f in $(find . -name '*.xml' -not -path './.git/*'); do
            echo "Checking $f"
            xmllint --noout "$f"
            found=1
          done
          [ "$found" -eq 0 ] && echo "No XML files in this repo, nothing to validate."
          exit 0

  line-endings:
    name: Line endings (rootfs must be LF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject CR in shipped files
        run: |
          set -euo pipefail
          # A CR breaks every shebang inside the image. .gitattributes prevents
          # it, but a file committed with `-c core.autocrlf=false` from a Windows
          # editor can still slip through.
          if grep -rlI $'\r' rootfs .github/assets/banner-raw.txt .github/workflows 2>/dev/null; then
            echo "::error::the files listed above contain CR characters, they must be LF only"
            exit 1
          fi
          echo "No CR characters in rootfs/, the banner or the workflows."
