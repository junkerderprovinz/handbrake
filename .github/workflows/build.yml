name: Build & Push

# -----------------------------------------------------------------------------
# Builds the HandBrake-on-Selkies image and pushes it to:
#   * GitHub Container Registry  (ghcr.io/junkerderprovinz/handbrake)
#   * Docker Hub                 (docker.io/<DOCKERHUB_USERNAME>/handbrake)
#     — active only once the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN
#       secret are set together; until then the build stays GHCR-only.
#
# Architecture: one NATIVE build job per platform (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm — free for public repos). Each job boots its image
# and runs the full smoke gate, including a REAL transcode, then pushes by
# digest; a merge job assembles the multi-arch manifest under the final tags.
# Native beats QEMU here because the gate actually encodes video: a HandBrake
# run under arm64 emulation would take minutes and time the gate out.
#
# Triggers:
#   * Push to main           -> tags: latest, sha-<short>
#   * Tag v*.*.*             -> tags: latest, <version>, <major>, <major>.<minor>
#   * Weekly cron (Sun 04 UTC) — picks up upstream Selkies base updates
#   * Manual workflow_dispatch
# -----------------------------------------------------------------------------

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  IMAGE_NAME: handbrake

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}

      - name: Build ${{ matrix.arch }} image for the smoke gate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: handbrake:smoke-${{ matrix.arch }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}

      # ---------------------------------------------------------------------
      # SMOKE GATE. A green docker build only proves the image BUILDS. This
      # proves it boots, serves the WebUI, keeps HandBrake's GUI alive, applies
      # the dark theme, and actually transcodes a video end to end.
      # ---------------------------------------------------------------------
      - name: Smoke test — ${{ matrix.arch }} must boot, stay up and transcode
        run: |
          set -euo pipefail
          img=handbrake:smoke-${{ matrix.arch }}
          name=hb-smoke

          fail() {
            echo "::error::$1"
            echo "---- container log ----"
            docker logs "$name" 2>&1 | tail -n 120 || true
            echo "---- GUI log ----"
            docker exec "$name" cat /config/handbrake-gui.log 2>/dev/null | tail -n 60 || true
            echo "---- watch job log ----"
            docker exec "$name" cat /config/handbrake-watch.log 2>/dev/null | tail -n 60 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit 1
          }

          echo "== static asserts =="
          docker run --rm --entrypoint sh "$img" -c 'test -x /usr/bin/ghb' \
            || { echo "::error::/usr/bin/ghb missing from the image"; exit 1; }
          docker run --rm --entrypoint sh "$img" -c 'HandBrakeCLI --version' \
            || { echo "::error::HandBrakeCLI does not run"; exit 1; }

          echo "== boot =="
          docker run -d --name "$name" -p 3000:3000 -p 3001:3001 "$img"

          up() {
            local c
            c=$(curl -k -o /dev/null -s -w '%{http_code}' --max-time 5 https://localhost:3001/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            c=$(curl -o /dev/null -s -w '%{http_code}' --max-time 5 http://localhost:3000/ || true)
            { [ -n "$c" ] && [ "$c" != "000" ]; } && return 0
            return 1
          }

          # Real 180s wall-clock deadline (each probe can spend ~10s in curl
          # timeouts, so an iteration counter would overshoot badly).
          deadline=$((SECONDS + 180))
          webui=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            if up; then echo "WebUI responded after ${SECONDS}s"; webui=1; break; fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then fail "container exited early"; fi
            sleep 1
          done
          [ "$webui" -eq 1 ] || fail "WebUI did not respond within 180s"

          echo "== dark theme =="
          theme=$(docker exec "$name" cat /run/s6/container_environment/GTK_THEME 2>/dev/null || echo "")
          echo "GTK_THEME=${theme}"
          [ "$theme" = "Adwaita:dark" ] || fail "GTK_THEME is '${theme}', expected 'Adwaita:dark' (dark must be the default)"

          echo "== GPU seam: the default must be software encoding =="
          vend=$(docker exec "$name" cat /run/handbrake/gpu-vendor 2>/dev/null || echo MISSING)
          args=$(docker exec "$name" cat /run/handbrake/gpu-args 2>/dev/null || echo MISSING)
          echo "gpu-vendor='${vend}' gpu-args='${args}'"
          [ "$vend" = "none" ] || fail "gpu-vendor is '${vend}', expected 'none' by default"
          [ -z "$args" ]       || fail "gpu-args is '${args}', expected empty by default"

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "== GPU seam: the Intel QSV runtime must be in the amd64 image =="
            docker run --rm --entrypoint sh "$img" -c \
              'test -e /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so' \
              || fail "iHD_drv_video.so is missing from the amd64 image"
            docker run --rm --entrypoint sh "$img" -c \
              'ls /usr/lib/x86_64-linux-gnu/libmfx-gen.so.1.2* >/dev/null 2>&1' \
              || fail "the oneVPL GPU runtime (libmfx-gen) is missing from the amd64 image"
            docker run --rm --entrypoint sh "$img" -c 'command -v vainfo >/dev/null' \
              || fail "vainfo is missing from the amd64 image"
          else
            echo "== GPU seam: QSV runtime is correctly absent on ${{ matrix.arch }} =="
          fi

          # No CI runner has a GPU, so only the fallback path is reachable here.
          # That is the path every user without the matching hardware hits, and a
          # regression in it would splice a bogus argument into every conversion.
          for v in intel amd; do
            echo "== GPU seam: GPU_VENDOR=${v} without a GPU must fall back loudly =="
            docker rm -f "hb-gpu-${v}" >/dev/null 2>&1 || true
            docker run -d --name "hb-gpu-${v}" -e "GPU_VENDOR=${v}" "$img" >/dev/null
            deadline=$((SECONDS + 180))
            seen=0
            while [ "$SECONDS" -lt "$deadline" ]; do
              if docker exec "hb-gpu-${v}" test -f /run/handbrake/gpu-args 2>/dev/null; then seen=1; break; fi
              sleep 2
            done
            if [ "$seen" -ne 1 ]; then
              docker logs "hb-gpu-${v}" 2>&1 | tail -n 60
              docker rm -f "hb-gpu-${v}" >/dev/null 2>&1 || true
              fail "GPU_VENDOR=${v}: /run/handbrake/gpu-args was never written"
            fi
            a=$(docker exec "hb-gpu-${v}" cat /run/handbrake/gpu-args)
            w=$(docker logs "hb-gpu-${v}" 2>&1 | grep -c "\[handbrake-gpu\] WARNING: GPU_VENDOR=${v}" || true)
            d=$(docker exec "hb-gpu-${v}" test -s /config/handbrake-gpu.log && echo yes || echo no)
            echo "GPU_VENDOR=${v}: args='${a}' warnings=${w} diag=${d}"
            docker rm -f "hb-gpu-${v}" >/dev/null 2>&1 || true
            [ -z "$a" ]      || fail "GPU_VENDOR=${v} produced args '${a}' on a GPU-less runner; expected empty"
            [ "$w" -ge 1 ]   || fail "GPU_VENDOR=${v} fell back without explaining why"
            [ "$d" = "yes" ] || fail "GPU_VENDOR=${v} wrote no /config/handbrake-gpu.log diagnostics"
          done

          echo "== HandBrake GUI is up and STAYS up =="
          pid1=""
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            pid1=$(docker exec "$name" pgrep -x ghb 2>/dev/null | head -n1 || true)
            [ -n "$pid1" ] && break
            sleep 2
          done
          [ -n "$pid1" ] || fail "the ghb GUI process never started"
          echo "ghb pid ${pid1}; holding 20s to prove it is not crash-looping"
          sleep 20
          pid2=$(docker exec "$name" pgrep -x ghb 2>/dev/null | head -n1 || true)
          [ -n "$pid2" ] || fail "the ghb GUI process died within 20s"
          [ "$pid1" = "$pid2" ] || fail "ghb restarted within 20s (pid ${pid1} -> ${pid2}) — crash loop"
          echo "ghb stayed up with an unchanged pid"

          echo "== watch daemon is up =="
          docker exec "$name" pgrep -f handbrake-watch.sh >/dev/null 2>&1 \
            || fail "the watch-folder daemon is not running"

          echo "== READY banner printed =="
          docker logs "$name" 2>&1 | grep -q 'HANDBRAKE IS READY' \
            || fail "the READY banner never printed"

          echo "== end-to-end transcode =="
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -v error -y -f lavfi -i testsrc=size=320x240:rate=15:duration=2 \
                 -f lavfi -i sine=frequency=440:duration=2 \
                 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /tmp/hb-smoke.mkv
          docker cp /tmp/hb-smoke.mkv "$name":/watch/hb-smoke.mkv
          docker exec "$name" chown abc:abc /watch/hb-smoke.mkv
          converted=0
          deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker exec "$name" test -s /output/hb-smoke.mp4 2>/dev/null; then converted=1; break; fi
            sleep 2
          done
          [ "$converted" -eq 1 ] || fail "the watch folder never produced /output/hb-smoke.mp4 within 240s"
          size=$(docker exec "$name" stat -c %s /output/hb-smoke.mp4)
          echo "converted file is ${size} bytes"
          [ "$size" -gt 1000 ] || fail "/output/hb-smoke.mp4 is suspiciously small (${size} bytes)"
          docker exec "$name" sh -c 'ls -a /output | grep -q "\.partial$"' \
            && fail "a .partial staging file was left behind in /output"

          echo "✅ smoke gate passed on ${{ matrix.arch }}"
          docker rm -f "$name" >/dev/null

      # ---------------------------------------------------------------------
      # FEATURE-PARITY GATE. Plan 1's smoke gate proves the container boots and
      # transcodes with the DEFAULT environment. This one boots a second
      # container with the parity features switched on and proves each of them
      # actually does something: the file manager serves the data mounts, denied
      # paths answer 403, the terminal binary is unlocked and keybound, dunst
      # runs, hooks fire with the documented arguments, and the staging directory
      # is used and left clean.
      # ---------------------------------------------------------------------
      - name: Feature-parity gate — ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img=handbrake:smoke-${{ matrix.arch }}
          name=hb-parity

          fail() {
            echo "::error::$1"
            echo "---- container log ----"
            docker logs "$name" 2>&1 | tail -n 150 || true
            echo "---- watch job log ----"
            docker exec "$name" cat /config/handbrake-watch.log 2>/dev/null | tail -n 60 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit 1
          }

          echo "== boot with the parity features on =="
          docker run -d --name "$name" \
            -p 3100:3000 -p 3101:3001 \
            -e CUSTOM_USER=parity \
            -e PASSWORD=parity-secret \
            -e WEB_TERMINAL=1 \
            -e WEB_NOTIFICATION=1 \
            -e WEB_FILE_MANAGER_DENIED_PATHS=/output/private \
            -e AUTOMATED_CONVERSION_STAGING_DIR=/staging \
            "$img"

          CURL="curl -k -s -u parity:parity-secret"

          deadline=$((SECONDS + 240))
          webui=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            c=$($CURL -o /dev/null -w '%{http_code}' --max-time 5 https://localhost:3101/ || true)
            if [ -n "$c" ] && [ "$c" != "000" ]; then echo "WebUI responded after ${SECONDS}s (HTTP $c)"; webui=1; break; fi
            if [ -z "$(docker ps -q --filter "name=$name")" ]; then fail "parity container exited early"; fi
            sleep 2
          done
          [ "$webui" -eq 1 ] || fail "the parity container's WebUI did not respond within 240s"

          echo "== authentication: the house pattern, not a second variable set =="
          anon=$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 10 https://localhost:3101/ || true)
          [ "$anon" = "401" ] || fail "expected 401 without credentials, got '${anon}' — CUSTOM_USER/PASSWORD did not enable basic auth"
          auth=$($CURL -o /dev/null -w '%{http_code}' --max-time 10 https://localhost:3101/ || true)
          [ "$auth" = "200" ] || fail "expected 200 with credentials, got '${auth}'"

          echo "== web file manager =="
          aliases=$(docker exec "$name" sh -c 'grep -c "alias /run/handbrake/webfm/;" /etc/nginx/sites-available/default' || echo 0)
          [ "$aliases" = "2" ] || fail "expected the farm alias in both nginx server blocks, found ${aliases} — did init-handbrake-web run before init-nginx?"
          docker exec "$name" sh -c 'test -L /run/handbrake/webfm/output && test -L /run/handbrake/webfm/watch' \
            || fail "the file-manager farm is missing the /output or /watch symlink"
          $CURL https://localhost:3101/files/ | grep -q 'output' \
            || fail "/files/ does not list the output folder"
          upload=$(docker exec "$name" cat /run/s6/container_environment/SELKIES_UPLOAD_DIR 2>/dev/null || echo "")
          [ "$upload" = "/watch" ] || fail "expected uploads to land in /watch, got '${upload}'"

          echo "== denied paths =="
          docker exec "$name" sh -c 'mkdir -p /output/private /output/publicish; echo x > /output/private/secret.txt; echo y > /output/publicish/ok.txt'
          d1=$($CURL -o /dev/null -w '%{http_code}' https://localhost:3101/files/output/private/ || true)
          d2=$($CURL -o /dev/null -w '%{http_code}' https://localhost:3101/files/output/private/secret.txt || true)
          d3=$($CURL -o /dev/null -w '%{http_code}' https://localhost:3101/files/output/publicish/ || true)
          [ "$d1" = "403" ] || fail "denied directory returned ${d1}, expected 403"
          [ "$d2" = "403" ] || fail "denied file returned ${d2}, expected 403"
          [ "$d3" = "200" ] || fail "a sibling of the denied path returned ${d3}, expected 200 — the deny location is over-matching"

          echo "== web terminal =="
          mode=$(docker exec "$name" stat -c '%A' /usr/bin/xterm)
          case "$mode" in -rwx*) : ;; *) fail "WEB_TERMINAL=1 but /usr/bin/xterm is ${mode}" ;; esac
          docker exec "$name" sh -c 'grep -q handbrake-terminal.sh /config/.config/openbox/rc.xml' \
            || fail "the Ctrl+Alt+T keybind is not in /config/.config/openbox/rc.xml"
          kb=$(docker exec "$name" sh -c 'grep -c "</keyboard>" /config/.config/openbox/rc.xml')
          [ "$kb" = "1" ] || fail "openbox rc.xml has ${kb} </keyboard> elements — the keybind insertion corrupted it"

          echo "== notifications =="
          docker exec "$name" sh -c 'pgrep -x dunst >/dev/null' || fail "WEB_NOTIFICATION=1 but dunst is not running"
          docker exec "$name" sh -c 'grep -q "^DISPLAY=" /run/handbrake/session-env' \
            || fail "/run/handbrake/session-env has no DISPLAY — the desktop session never wrote it"

          echo "== CJK fonts come from the base, no ENABLE_CJK_FONT needed =="
          cjk=$(docker exec "$name" sh -c 'fc-list :lang=ja | wc -l')
          [ "$cjk" -gt 0 ] || fail "no Japanese-capable font in the image"

          echo "== hooks + staging: one real transcode =="
          # Built as temp files and docker cp'd in, not a shell heredoc: an
          # embedded heredoc body inside a YAML "|" block scalar has to sit at
          # the block's OWN indentation or YAML ends the block scalar early,
          # which breaks the workflow file itself, not just the hook contract.
          mkdir -p /tmp/hb-hooks
          printf 'echo "PRE|$1|$2|$3" > /config/hook-pre.txt\n' > /tmp/hb-hooks/pre_conversion.sh
          printf 'echo "POST|$1|$2|$3|$4" > /config/hook-post.txt\n' > /tmp/hb-hooks/post_conversion.sh
          printf 'echo "FOLDER|$1" > /config/hook-folder.txt\n' > /tmp/hb-hooks/post_watch_folder_processing.sh
          docker exec "$name" mkdir -p /config/hooks
          docker cp /tmp/hb-hooks/pre_conversion.sh "$name":/config/hooks/pre_conversion.sh
          docker cp /tmp/hb-hooks/post_conversion.sh "$name":/config/hooks/post_conversion.sh
          docker cp /tmp/hb-hooks/post_watch_folder_processing.sh "$name":/config/hooks/post_watch_folder_processing.sh
          docker exec "$name" chown -R abc:abc /config/hooks

          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -v error -y -f lavfi -i testsrc=size=320x240:rate=15:duration=2 \
                 -c:v libx264 -pix_fmt yuv420p /tmp/hb-parity.mkv
          docker cp /tmp/hb-parity.mkv "$name":/watch/hb-parity.mkv
          docker exec "$name" chown abc:abc /watch/hb-parity.mkv

          converted=0
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker exec "$name" test -s /output/hb-parity.mp4 2>/dev/null; then converted=1; break; fi
            sleep 3
          done
          [ "$converted" -eq 1 ] || fail "the parity container never produced /output/hb-parity.mp4 within 300s"

          # The post-folder hook fires at the end of the pass, so give the loop
          # one more interval to come round.
          sleep 15

          docker exec "$name" sh -c 'cat /config/hook-pre.txt' | grep -q '^PRE|/output/hb-parity.mp4|/watch/hb-parity.mkv|' \
            || fail "pre_conversion.sh did not receive (output, source, preset) in that order"
          docker exec "$name" sh -c 'cat /config/hook-post.txt' | grep -q '^POST|0|/output/hb-parity.mp4|/watch/hb-parity.mkv|' \
            || fail "post_conversion.sh did not receive (status, output, source, preset) in that order"
          docker exec "$name" sh -c 'cat /config/hook-folder.txt' | grep -q '^FOLDER|/watch$' \
            || fail "post_watch_folder_processing.sh did not receive the watch folder"

          docker exec "$name" sh -c 'ls -A /staging | grep -q .' \
            && fail "the staging directory still holds files after a successful conversion"
          docker exec "$name" sh -c 'ls -a /output | grep -qE "\.partial$|\.moving$"' \
            && fail "a .partial or .moving file was left behind in /output"
          docker exec "$name" sh -c 'ls -a /watch | grep -q handbrake-lock' \
            && fail "a watch-folder lock was not released"

          echo "✅ feature-parity gate passed on ${{ matrix.arch }}"
          docker rm -f "$name" >/dev/null

      # ---------------------------------------------------------------------
      # BEYOND-PARITY GATE. Three features added after full jlesage parity was
      # reached: watch-folder directory exclusion, a daily active-hours
      # window, and a hook for manual (non-watch-folder) GUI conversions.
      # ---------------------------------------------------------------------
      - name: Beyond-parity gate — ${{ matrix.arch }}
        run: |
          set -euo pipefail
          img=handbrake:smoke-${{ matrix.arch }}
          name=hb-beyond

          fail() {
            echo "::error::$1"
            echo "---- container log ----"
            docker logs "$name" 2>&1 | tail -n 150 || true
            docker exec "$name" cat /config/handbrake-watch.log 2>/dev/null | tail -n 60 || true
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit 1
          }

          wait_for_webui() {
            local deadline=$((SECONDS + 180)) up=0
            while [ "$SECONDS" -lt "$deadline" ]; do
              c=$(curl -k -s -o /dev/null -w '%{http_code}' --max-time 5 https://localhost:3101/ || true)
              if [ -n "$c" ] && [ "$c" != "000" ]; then up=1; break; fi
              if [ -z "$(docker ps -q --filter "name=$name")" ]; then fail "container exited early"; fi
              sleep 2
            done
            [ "$up" -eq 1 ] || fail "the WebUI did not respond within 180s"
          }

          # svc-handbrake-watch is a separate longrun from svc-nginx, with no
          # dependency between them — the WebUI answering does NOT guarantee
          # the watch daemon has printed its startup log lines yet. A bare
          # one-shot grep right after wait_for_webui raced and failed on a
          # slower runner; poll instead.
          wait_for_log() {
            local pattern="$1" timeout="${2:-30}" deadline
            deadline=$((SECONDS + timeout))
            while [ "$SECONDS" -lt "$deadline" ]; do
              docker logs "$name" 2>&1 | grep -q "$pattern" && return 0
              sleep 2
            done
            return 1
          }

          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          ffmpeg -v error -y -f lavfi -i testsrc=size=320x240:rate=15:duration=2 \
                 -c:v libx264 -pix_fmt yuv420p /tmp/hb-beyond.mkv

          echo "== ignore-directories: an ignored subdir is skipped, a sibling still converts =="
          docker run -d --name "$name" -p 3101:3001 \
            -e AUTOMATED_CONVERSION_IGNORE_DIRECTORIES=ignoreme "$img"
          wait_for_webui
          docker exec "$name" sh -c 'mkdir -p /watch/ignoreme /watch/real'
          docker cp /tmp/hb-beyond.mkv "$name":/watch/ignoreme/skip.mkv
          docker cp /tmp/hb-beyond.mkv "$name":/watch/real/convert.mkv
          docker exec "$name" chown -R abc:abc /watch/ignoreme /watch/real

          converted=0
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if docker exec "$name" test -s /output/convert.mp4 2>/dev/null; then converted=1; break; fi
            sleep 3
          done
          [ "$converted" -eq 1 ] || fail "the file outside the ignored directory was never converted"
          sleep 10
          docker exec "$name" sh -c 'test -e /output/skip.mp4' \
            && fail "a file inside an AUTOMATED_CONVERSION_IGNORE_DIRECTORIES entry was converted anyway"
          docker rm -f "$name" >/dev/null

          echo "== active hours: idles outside a window that excludes the current UTC hour =="
          cur_hour=$(date -u +%-H)
          excl_start=$(( (cur_hour + 3) % 24 ))
          excl_end=$(( (excl_start + 1) % 24 ))
          window=$(printf '%02d-%02d' "$excl_start" "$excl_end")
          docker run -d --name "$name" -p 3101:3001 \
            -e AUTOMATED_CONVERSION_ACTIVE_HOURS="$window" "$img"
          wait_for_webui
          wait_for_log "active hours: ${window}" 30 \
            || fail "the active-hours setting '${window}' never appeared in the startup log"
          docker cp /tmp/hb-beyond.mkv "$name":/watch/outside-window.mkv
          docker exec "$name" chown abc:abc /watch/outside-window.mkv
          wait_for_log "outside the active hours window (${window})" 30 \
            || fail "the daemon never logged that it was outside the active-hours window"
          docker exec "$name" sh -c 'test -e /output/outside-window.mp4' \
            && fail "a file was converted outside the configured active-hours window"
          docker rm -f "$name" >/dev/null

          echo "== manual GUI hook: HandBrake's own preferences get wired on the second start =="
          docker run -d --name "$name" -p 3101:3001 "$img"
          wait_for_webui
          sleep 15
          docker exec "$name" test -f /config/.config/ghb/preferences.json \
            || fail "ghb never created its own preferences.json on first start"
          docker restart "$name" >/dev/null
          wait_for_webui
          sleep 5
          docker logs "$name" 2>&1 | grep -q "wired the manual-conversion GUI hook" \
            || fail "init-handbrake never logged wiring the manual-conversion GUI hook on the second start"
          docker exec "$name" sh -c \
            'jq -e ".Preferences.SendFileTo == true and .Preferences.SendFileToTarget == \"/usr/local/bin/handbrake-gui-hook.sh\"" /config/.config/ghb/preferences.json' \
            >/dev/null || fail "SendFileTo/SendFileToTarget were not wired into ghb's preferences.json"
          docker rm -f "$name" >/dev/null

          echo "✅ beyond-parity gate passed on ${{ matrix.arch }}"

      # CVE scan of the locally-loaded smoke image. Report-only: exit-code 0 so
      # a HIGH/CRITICAL finding never blocks the build — results land in the
      # repo's Security tab. ignore-unfixed hides CVEs with no upstream fix.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: handbrake:smoke-${{ matrix.arch }}
          format: sarif
          output: trivy-results-${{ matrix.arch }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"     # MUST stay 0 — report only, never fail the build

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.arch }}

      - name: Push ${{ matrix.arch }} by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=schedule,pattern=weekly
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Create multi-arch manifests
        working-directory: /tmp/digests
        # tags come from the DOCKER_METADATA_OUTPUT_TAGS env the metadata action
        # exports — no ${{ }} interpolation inside the script (injection hygiene)
        run: |
          set -euo pipefail
          src="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          sources=""
          for d in *; do sources="$sources ${src}@sha256:${d}"; done
          echo "sources:${sources}"
          tagargs=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tagargs="$tagargs -t $tag"
          done <<< "$DOCKER_METADATA_OUTPUT_TAGS"
          echo "tags:${tagargs}"
          # Cross-registry copy (GHCR -> Docker Hub) can hit a transient HTTP/2
          # PROTOCOL_ERROR on large layers; retry a few times before failing.
          n=0
          until docker buildx imagetools create ${tagargs} ${sources}; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then echo "imagetools create failed after $n attempts"; exit 1; fi
            echo "imagetools create failed (attempt $n); retrying in $((n * 15))s..."
            sleep $((n * 15))
          done

      - name: Inspect
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # Mirror the GitHub README to the Docker Hub repo description. Editing the
      # description needs a credential the push token lacks (it returns 403), so
      # this uses a separate DOCKERHUB_PASSWORD secret. Skipped until that
      # secret is set, so a missing credential never fails the build.
      - name: Checkout (README for the Docker Hub sync)
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        uses: actions/checkout@v7

      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$PW" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "DOCKERHUB_PASSWORD not set — skipping the Docker Hub description sync"
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          short-description: "HandBrake video transcoder for Unraid, in your browser via Selkies, dark by default."
          enable-url-completion: true
