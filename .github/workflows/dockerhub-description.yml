# Pushes the README to the Docker Hub Overview without building an image.
# build.yml does the same after every multi-arch build; this run isolates the
# credential when that sync starts failing.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Unlike build.yml there is no gate and no continue-on-error: a missing
      # secret or a refused login should turn this run red.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/handbrake
          short-description: "HandBrake for Unraid: the full video transcoder in your browser, with an automated watch folder."
          enable-url-completion: true
