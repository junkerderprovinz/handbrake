# Built from the Unraid template in junkerderprovinz/unraid-apps by
# .github/gen-compose.py. Change the template there, not this file.
#
# Folders are created next to this file on the first start. Point the ones
# that hold your own files (downloads, storage and the like) at real folders
# first, and fill in every value marked "required".

services:
  handbrake:
    image: junkerderprovinz/handbrake:latest
    container_name: handbrake
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "3001:3001"
      - "3000:3000"
    volumes:
      - "./appdata:/config"
      - "./storage:/storage:ro"
      - "./watch:/watch"
      - "./output:/output"
    environment:
      HANDBRAKE_THEME: dark
      KEYBOARD_LAYOUT: us
      GPU_VENDOR: none
      APP_NICENESS: "0"
      AUTOMATED_CONVERSION: "1"
      AUTOMATED_CONVERSION_PRESET: "General/Very Fast 1080p30"
      AUTOMATED_CONVERSION_FORMAT: mp4
      AUTOMATED_CONVERSION_KEEP_SOURCE: "1"
      AUTOMATED_CONVERSION_OVERWRITE_OUTPUT: "0"
      AUTOMATED_CONVERSION_SOURCE_STABLE_TIME: "5"
      AUTOMATED_CONVERSION_CHECK_INTERVAL: "5"
      AUTOMATED_CONVERSION_MAX_WATCH_FOLDERS: "5"
      WEB_FILE_MANAGER: "1"
      WEB_FILE_MANAGER_ALLOWED_PATHS: AUTO
      WEB_TERMINAL: "0"
      WEB_TERMINAL_SHELL_PATH: /bin/bash
      WEB_NOTIFICATION: "0"
      ATTACHED_DEVICES_PERMS: "/dev/sr*"
      INSTALL_LIBDVDCSS: "false"
      TZ: Europe/Vienna
      PUID: "1000"
      PGID: "1000"
      UMASK: "022"
